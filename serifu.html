<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="./assets/app.css">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>プリズムショー セリフ表示</title>
</head>
<body class="serifu-page">
  <main id="setup" class="setup-screen serifu-setup">
    <div class="setup-panel">
      <a class="back-link" href="./index.html">‹ 機能一覧</a>
      <h1>プリズムショー セリフ表示</h1>
      <p class="setup-lead" id="song-description">曲中セリフを、タイミングに合わせて大きく表示します。</p>
      <div id="song-select-wrap" class="song-select-wrap" hidden>
        <label for="song-select">曲を選択</label>
        <select id="song-select" class="song-select"></select>
      </div>
      <button type="button" class="primary-button" id="go">表示画面へ</button>
      <p class="setup-help">カラオケが始まった瞬間に画面をタップすると同期開始。<br>ずれたら表示画面の下部ボタンで±調整、再タップで最初から。</p>
      <h2 class="list-heading">全セリフ（練習用）</h2>
      <ol id="line-list" class="line-list"></ol>
    </div>
  </main>
  <div id="stage" class="serifu-stage" hidden aria-label="セリフ表示画面、タップで同期し直し">
    <div class="serifu-clock" id="clock">0:00</div>
    <div class="serifu-now">
      <div class="serifu-speaker" id="now-speaker"> </div>
      <div class="serifu-text" id="now-text">カラオケが始まったら画面をタップ</div>
      <div class="serifu-next" id="next-text"></div>
    </div>
    <div class="serifu-controls">
      <button type="button" data-offset="-1000">−1秒</button>
      <button type="button" data-offset="-500">−0.5秒</button>
      <button type="button" data-offset="500">＋0.5秒</button>
      <button type="button" data-offset="1000">＋1秒</button>
    </div>
    <button id="back" type="button" class="stage-back">戻る</button>
  </div>
  <script type="module" src="./src/serifu.mjs"></script>
</body>
</html>
