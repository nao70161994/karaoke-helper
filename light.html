<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="./assets/app.css">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>126BPMで照明が点滅するページ</title>
</head>
<body class="light-page">
  <main id="setup" class="setup-screen">
    <div class="setup-panel">
      <a class="back-link" href="./index.html">‹ 機能一覧</a>
      <h1>126BPMで照明が点滅するページ</h1>
      <p class="setup-lead">スマホの画面の明るさを最大にしてください。</p>
      <div class="side-choices" role="group" aria-label="スマホの位置">
        <button type="button" id="left" aria-pressed="true">左スマホ</button>
        <button type="button" id="right" aria-pressed="false">右スマホ</button>
      </div>
      <button type="button" class="primary-button" id="go">点灯画面へ</button>
      <p class="setup-help">2台とも曲の同じ拍で画面をタップ。<br>ずれたら再タップで拍合わせ。</p>
    </div>
  </main>
  <div id="stage" class="stage" hidden aria-label="点灯画面、タップで拍合わせ">
    <div class="stage-hint">曲の拍に合わせてタップ</div>
    <button id="back" type="button" class="stage-back">戻る</button>
  </div>
  <script type="module" src="./src/lighting.mjs"></script>
</body>
</html>
